name: Build Tweak

on:   
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Cache Theos (+ submodule) - "git clone --recursive" toàn bộ Theos lại từ đầu MỖI LẦN build
      # là phần chậm nhất của cả pipeline, trong khi Theos gần như không đổi giữa các lần build của
      # CHÍNH project này. Cache theo key CỐ ĐỊNH (đổi hậu tố "v1" thủ công nếu cần ép làm mới) -
      # cache hit thì bỏ qua hẳn bước clone, cache miss (lần đầu/sau khi đổi key) thì clone như cũ
      # rồi lưu lại cho lần sau.
      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-v1

      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Point THEOS env at cached/installed dir
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      # Cache ldid ĐÃ BỎ - cache riêng /Cellar/ldid mà KHÔNG cache theo libplist (thư viện phụ
      # thuộc thật của ldid, cài riêng qua brew) khiến bản cache khôi phục bị thiếu .dylib cần
      # thiết -> ldid crash lúc ký (xác nhận qua log CI thật: "Library not loaded:
      # libplist-2.0.4.dylib"). Homebrew có đồ thị phụ thuộc phức tạp, cache theo kiểu "chỉ 1 gói"
      # không đáng tin cậy - quay lại cài mới mỗi lần (rẻ hơn nhiều so với Theos nên không đáng để
      # cache liều).
      - name: Install ldid
        run: |
          brew install ldid

      - name: Generate MIG exception server stubs (mach_exc)
        run: |
          # /usr/include có thể không tồn tại trên macOS bản mới (chỉ có header qua SDK) - thử
          # SDK macOS đang active trước (xcrun), rồi mới quét rộng trong Xcode.app làm phương án
          # dự phòng (Xcode.app luôn có bản copy header của mọi SDK bên trong, dù /usr/include có
          # được cài đặt hay không).
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null)
          MACH_EXC_DEFS="$SDK_PATH/usr/include/mach/mach_exc.defs"
          if [ ! -f "$MACH_EXC_DEFS" ]; then
            MACH_EXC_DEFS=$(find /usr/include/mach /Applications/Xcode*.app -name "mach_exc.defs" 2>/dev/null | head -1)
          fi
          if [ -z "$MACH_EXC_DEFS" ] || [ ! -f "$MACH_EXC_DEFS" ]; then
            echo "mach_exc.defs not found on this runner!" >&2
            exit 1
          fi
          echo "Using defs file: $MACH_EXC_DEFS"
          mkdir -p Source/Includes/Generated
          mig -header Source/Includes/Generated/mach_exc.h \
              -user Source/Includes/Generated/mach_excUser.c \
              -server Source/Includes/Generated/mach_excServer.c \
              -sheader Source/Includes/Generated/mach_exc_server.h \
              "$MACH_EXC_DEFS"
          echo "Generated files:"
          ls -la Source/Includes/Generated

      - name: Dump real arm_thread_state64_set_pc_fptr signature from SDK
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          HDR="$SDK_PATH/usr/include/mach/arm/_structs.h"
          echo "Using header: $HDR"
          if [ -f "$HDR" ]; then
            grep -n -B2 -A 15 "arm_thread_state64_set_pc_fptr\|arm_thread_state64_get_pc_fptr" "$HDR" || echo "pattern not found in _structs.h"
          else
            echo "_structs.h not found at expected path, searching..."
            find "$SDK_PATH/usr/include/mach" -name "*.h" -exec grep -l "arm_thread_state64_set_pc_fptr" {} \; | while read f; do
              echo "=== $f ==="
              grep -n -B2 -A 15 "arm_thread_state64_set_pc_fptr\|arm_thread_state64_get_pc_fptr" "$f"
            done
          fi

      - name: Build with Theos
        run: |
          make clean
          make package

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: |
            *.deb
            packages/*.deb
            .theos/_/*.deb
